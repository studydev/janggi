name: Publish container image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          docker run --rm "$image" nginx -t
          docker run -d --name janggi -p 8080:80 "$image"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
            docker ps -a
            docker logs janggi || true
            echo "::error::container did not become healthy"
            exit 1
          fi
          home=$(curl -fsS http://127.0.0.1:8080/)
          case "$home" in *'같은 명세를 주면'*) ;; *) echo "::error::landing copy missing"; exit 1 ;; esac
          test "$(grep -c 'thumbs/' <<<"$home")" = "10"
          for p in copus csonn luna opus5 sol sol-fast astra codex-astra sonn5 terra comparison; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/$p/")
            echo "/$p/ -> $code"
            test "$code" = "200"
          done
          comparison=$(curl -fsS http://127.0.0.1:8080/comparison/)
          case "$comparison" in *'같은 장기'*) ;; *) echo "::error::comparison copy missing"; exit 1 ;; esac
          details=$(curl -fsS http://127.0.0.1:8080/comparison/details.html)
          case "$details" in *'7종 비교 리포트'*) ;; *) echo "::error::details copy missing"; exit 1 ;; esac
          docker rm -f janggi
