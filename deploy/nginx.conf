server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 해시가 붙은 번들은 영구 캐시해도 안전하다.
    location ~ ^/[a-z0-9]{1,8}/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # nginx 기본 mime.types 에 .webmanifest 가 없다.
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # /luna -> /luna/ (정규 URL)
    location ~ ^/(?<app>[a-z0-9]{1,8})$ {
        return 301 /$app/;
    }

    # 각 구현은 독립된 정적 앱. 없는 경로는 해당 앱의 index.html 로 폴백한다.
    location ~ ^/(?<app>[a-z0-9]{1,8})/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri /$app/index.html;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
